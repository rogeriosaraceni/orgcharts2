<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>


        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <!-- Icon Fonts -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>

        <!-- CSS -->
        <link rel="stylesheet" href="https://supplyportal-dev.archivesdl.com/gop/2026/assets/css/rsframework.css?v=2.9.8">
        <link rel="stylesheet" href="https://supplyportal-dev.archivesdl.com/gop/2026/assets/css/rsframework-form.css?v=2.9.8">
        <link rel="stylesheet" href="https://supplyportal-dev.archivesdl.com/gop/2026/assets/css/rsframework-custom.css?v=2.9.8"> 
        <link rel="stylesheet" href="https://supplyportal-dev.archivesdl.com/gop/2026/assets/css/plugins/magnific-popup.css?v=2.9.8">
        <link rel="stylesheet" href="https://supplyportal-dev.archivesdl.com/gop/2026/modulos/kpi_pi_tree/setup/build-view5/orgChart/orgchart-custom.css?v=1.3">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <!-- JS rsframework -->
        <script src="https://supplyportal-dev.archivesdl.com/gop/2026/assets/js/rsframework.js?v=2.9.8"></script>
        <script src="https://supplyportal-dev.archivesdl.com/gop/2026/assets/js/rsframework-form.js?v=2.9.8"></script>

        <script src="https://supplyportal-dev.archivesdl.com/gop/2026/assets/js/plugins/magnific-popup.min.js?v=2.9.8"></script>
        <script src="https://supplyportal-dev.archivesdl.com/gop/2026/modulos/kpi_pi_tree/setup/build-view5/orgChart/orgchart.js"></script>
    </head>

    <body class="popup">
        <!-- JS rsframework -->
        <form method="POST" class="rsform" action="">
            <fieldset>
                <legend>Create - Indicator</legend>
                
                <div class="row">
                    <label class="col-sm-10">
                        <span>Name Indicator:</span>
                        <input type="text" name="nome" class="fc" value="">
                    </label>
                    
                    <label class="col-sm-2">
                        <div style="padding-top:17px !important;">
                            <button type="submit" class="btn btn-blue">Save</button>
                        </div>
                    </label>
                </div>			
            </fieldset>
        </form>

        <script>
            $(document).ready(function() {
                $('.rsform').on('submit', function(e) {
                    e.preventDefault();
                    console.log("Submit detectado!"); // Debug para ver se o clique funciona

                    const novoIndicador = $("input[name='nome']").val();
                    
                    if (novoIndicador && novoIndicador.trim() !== "") {
                        // Verifica se a função existe no pai antes de chamar
                        if (window.parent && window.parent.adicionarIndicadorAoNode) {
                            window.parent.adicionarIndicadorAoNode(novoIndicador);
                            window.parent.$.magnificPopup.close();
                        } else {
                            console.error("Função adicionarIndicadorAoNode não encontrada na página pai.");
                        }
                    } else {
                        alert("Por favor, insira um nome para o indicador.");
                    }
                });
            });
        </script>
    </body>
</html>
